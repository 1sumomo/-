<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="現場黒板">
<meta name="theme-color" content="#0d110e">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>現場黒板</title>
<style>
/* Camera-first dark UI. Portrait: top bar / viewfinder / controls. Landscape: viewfinder left, controls column right. */
:root{
  --bg:#0d110e; --panel:#171d19; --panel2:#1f2721; --line:#2c362f; --ink:#eef1ec; --muted:#98a49b;
  --chalk:#f0d27a; --board:#2f5141; --danger:#ef8a6d; --ok:#8fd0a8;
  --f:"Hiragino Sans","Hiragino Kaku Gothic ProN","Yu Gothic","Noto Sans JP",system-ui,sans-serif;
  --st:env(safe-area-inset-top,0px); --sb:env(safe-area-inset-bottom,0px); --sl:env(safe-area-inset-left,0px); --sr:env(safe-area-inset-right,0px);
  color-scheme:dark;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:var(--f);font-size:15px;line-height:1.5;overscroll-behavior:none}
body{position:fixed;inset:0;overflow:hidden;-webkit-user-select:none;user-select:none;font-variant-numeric:tabular-nums}
input,textarea,select{-webkit-user-select:text;user-select:text}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;touch-action:manipulation}
:focus-visible{outline:2px solid var(--chalk);outline-offset:2px}
[hidden]{display:none!important}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--line);background:var(--panel2);border-radius:10px;padding:10px 14px;font-weight:700;white-space:nowrap}
.btn.primary{background:var(--chalk);color:#1a1a12;border-color:var(--chalk)}
.btn.ghost{background:none}
.btn.danger{color:var(--danger);border-color:currentColor;background:none}
.btn.small{padding:6px 10px;font-size:13px;border-radius:8px}
.btn[disabled]{opacity:.45;cursor:default}
.ib{width:42px;height:42px;border-radius:50%;border:0;background:rgba(255,255,255,.08);display:inline-flex;align-items:center;justify-content:center;flex:none}
.ib[aria-pressed="true"]{background:var(--chalk);color:#1a1a12}
.ib svg{width:22px;height:22px}

/* ---------- camera ---------- */
#cam{position:absolute;inset:0;display:grid;grid-template-rows:auto 1fr auto;grid-template-areas:"top" "stage" "ctrl"}
.topbar{grid-area:top;display:flex;align-items:center;gap:8px;padding:calc(var(--st) + 6px) calc(var(--sr) + 12px) 6px calc(var(--sl) + 12px)}
.projbtn{flex:1;min-width:0;display:flex;align-items:center;gap:6px;border:0;background:none;padding:6px 4px;font-weight:700;font-size:15px;text-align:left}
.projbtn span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.projbtn svg{flex:none;width:16px;height:16px;opacity:.7}
#stage{grid-area:stage;position:relative;overflow:hidden;background:#000;min-height:0}
#video{position:absolute;inset:0;width:100%;height:100%;object-fit:contain}
#overlay{position:absolute;inset:0;width:100%;height:100%;touch-action:none}
#flash{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none}
#flash.on{animation:fl .25s ease-out}
@keyframes fl{from{opacity:.75}to{opacity:0}}
.zoom{position:absolute;left:50%;transform:translateX(-50%);bottom:10px;display:flex;gap:6px}
.zoom button{border:0;border-radius:999px;background:rgba(0,0,0,.5);color:#fff;font-size:12px;font-weight:700;width:38px;height:38px}
.zoom button[aria-pressed="true"]{color:var(--chalk)}
#camMsg{position:absolute;inset:0;display:grid;place-items:center;padding:24px;text-align:center;background:#000}
#camMsg div{max-width:340px;display:grid;gap:14px;color:var(--muted)}
#camMsg b{color:var(--ink);font-size:17px}

.ctrl{grid-area:ctrl;display:grid;gap:10px;padding:10px calc(var(--sr) + 12px) calc(var(--sb) + 12px) calc(var(--sl) + 12px)}
.bbar{display:flex;gap:6px;align-items:stretch;min-height:52px}
.bdup{flex:none;width:58px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;border:1px solid var(--line);background:var(--panel);border-radius:10px;font-size:11px;font-weight:700;color:var(--ink);line-height:1.2;padding:4px}
.bdup svg{width:20px;height:20px;color:var(--chalk)}
.bnav{flex:none;width:36px;border:1px solid var(--line);background:var(--panel);border-radius:10px;font-size:20px;font-weight:700;padding:0}
.bnav[disabled]{opacity:.3}
.bcur{flex:1;min-width:0;display:flex;align-items:center;gap:8px;text-align:left;border:1px solid var(--chalk);background:#2a2a1c;border-radius:10px;padding:6px 10px;line-height:1.3}
.bcur .t{flex:1;min-width:0}
.bcur b{display:block;font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bcur .t span{display:block;font-size:11px;color:var(--chalk);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bcur small{flex:none;font-size:11px;color:var(--muted)}
.bcur svg{flex:none;width:16px;height:16px;opacity:.8}
.sokuten{display:flex;align-items:center;gap:8px}
.sokuten .lab{font-size:12px;color:var(--muted);letter-spacing:.06em}
.sokuten .val{flex:1;min-width:0;text-align:center;font-weight:700;font-size:18px;border:0;background:none;padding:4px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sokuten .step{width:52px;height:40px;border-radius:10px;border:1px solid var(--line);background:var(--panel);font-size:20px;font-weight:700}
.shootrow{display:grid;grid-template-columns:1fr auto 1fr;align-items:center}
.last{justify-self:start;position:relative;width:52px;height:52px;border-radius:10px;border:1px solid var(--line);background:var(--panel);padding:0;overflow:hidden}
.last img{width:100%;height:100%;object-fit:cover;display:block}
.last .cnt{position:absolute;right:2px;bottom:2px;background:rgba(0,0,0,.7);border-radius:6px;padding:0 5px;font-size:11px;font-weight:700}
.shutter{width:76px;height:76px;border-radius:50%;border:4px solid #fff;background:none;padding:4px}
.shutter i{display:block;width:100%;height:100%;border-radius:50%;background:#fff;transition:transform .1s}
.shutter:active i{transform:scale(.88)}
.editb{justify-self:end;display:flex;flex-direction:column;align-items:center;gap:2px;border:0;background:none;font-size:11px;color:var(--muted)}
.editb .ib{background:var(--board);color:#fff}

@media (orientation:landscape) and (max-height:600px){
  #cam{grid-template-columns:1fr minmax(210px,30%);grid-template-rows:auto 1fr;grid-template-areas:"stage top" "stage ctrl"}
  .topbar{padding:calc(var(--st) + 8px) calc(var(--sr) + 10px) 4px 10px}
  .ctrl{align-content:end;padding:6px calc(var(--sr) + 10px) calc(var(--sb) + 10px) 10px;min-height:0}
  #stage{margin-left:var(--sl)}
}

/* ---------- library ---------- */
#lib{position:absolute;inset:0;display:flex;flex-direction:column;background:var(--bg)}
.lhead{display:flex;align-items:center;gap:8px;padding:calc(var(--st) + 8px) calc(var(--sr) + 14px) 8px calc(var(--sl) + 14px);border-bottom:1px solid var(--line)}
.lhead h1{flex:1;min-width:0;margin:0;font-size:16px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lhead h1 small{display:block;font-size:12px;color:var(--muted);font-weight:400}
.lbody{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:12px calc(var(--sr) + 14px) calc(var(--sb) + 90px) calc(var(--sl) + 14px)}
.chips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin-bottom:12px}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--line);background:var(--panel);border-radius:999px;padding:6px 12px;font-size:13px;white-space:nowrap}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.chip .c{opacity:.65;margin-left:4px}
.group{margin-bottom:22px}
.group h2{font-size:13px;color:var(--muted);margin:0 0 2px;font-weight:400;display:flex;gap:8px;align-items:baseline}
.group h2 b{color:var(--ink);font-size:16px}
.sub{font-size:13px;color:var(--muted);margin:10px 0 6px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(100px,1fr));gap:5px}
.tile{position:relative;border:0;padding:0;background:var(--panel);border-radius:6px;overflow:hidden;aspect-ratio:4/3}
.tile img{width:100%;height:100%;object-fit:cover;display:block}
.tile .meta{position:absolute;left:0;right:0;bottom:0;padding:12px 6px 3px;font-size:11px;line-height:1.3;color:#fff;text-align:left;background:linear-gradient(transparent,rgba(0,0,0,.7));white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tile .tick{position:absolute;top:5px;right:5px;width:22px;height:22px;border-radius:50%;border:2px solid #fff;background:rgba(0,0,0,.3)}
.tile.sel{outline:3px solid var(--chalk);outline-offset:-3px}
.tile.sel .tick{background:var(--chalk);border-color:var(--chalk)}
.tile.sel .tick::after{content:"";position:absolute;left:6px;top:2px;width:5px;height:10px;border:solid #1a1a12;border-width:0 2px 2px 0;transform:rotate(45deg)}
.empty{color:var(--muted);text-align:center;padding:48px 16px}
.selbar{position:absolute;left:0;right:0;bottom:0;background:var(--panel);border-top:1px solid var(--line);padding:10px calc(var(--sr) + 14px) calc(var(--sb) + 10px) calc(var(--sl) + 14px);display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.selbar .sp{flex:1;font-weight:700;font-size:14px}

/* ---------- sheets ---------- */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--panel);width:100%;max-width:620px;max-height:calc(100% - var(--st) - 12px);overflow-y:auto;-webkit-overflow-scrolling:touch;border-radius:16px 16px 0 0;padding:8px calc(var(--sr) + 16px) calc(var(--sb) + 18px) calc(var(--sl) + 16px)}
.grab{width:40px;height:4px;border-radius:2px;background:var(--line);margin:4px auto 12px}
.sheet h3{margin:0 0 4px;font-size:18px}
.lead{color:var(--muted);font-size:13px;margin:0 0 14px}
.fields{display:grid;grid-template-columns:minmax(0,1fr);gap:12px}
.fields>*,.row2>*{min-width:0}
.f label{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);margin-bottom:4px;letter-spacing:.04em}
.f input,.f select,.f textarea{width:100%;padding:10px 11px;border:1px solid var(--line);border-radius:8px;background:var(--bg);font-size:16px;min-width:0}
.f textarea{min-height:56px;resize:vertical}
.sugg{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin-top:6px}
.sugg::-webkit-scrollbar{display:none}
.sugg button{flex:none;border:1px solid var(--line);background:var(--panel2);border-radius:999px;padding:4px 10px;font-size:13px}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg button{border:1px solid var(--line);background:var(--panel2);border-radius:8px;padding:7px 10px;font-size:13px}
.seg button[aria-pressed="true"]{background:var(--chalk);color:#1a1a12;border-color:var(--chalk);font-weight:700}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.actions{display:flex;gap:8px;margin-top:18px;flex-wrap:wrap;align-items:center}
.actions .sp{flex:1}
.hint{font-size:12px;color:var(--muted);margin:10px 0 0}
.plist{display:grid;gap:6px;margin-bottom:14px}
.pitem{display:flex;align-items:center;gap:10px;border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:10px 12px;text-align:left;width:100%}
.pitem[aria-pressed="true"]{border-color:var(--chalk)}
.pitem b{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pitem small{color:var(--muted)}
.toggle{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 0;border-bottom:1px solid var(--line)}
.toggle input{width:22px;height:22px;accent-color:var(--chalk)}
.viewer{width:100%;border-radius:8px;background:#000;display:block;max-height:50vh;object-fit:contain}
.progress{height:4px;background:var(--line);border-radius:2px;overflow:hidden;margin-top:10px}
.progress i{display:block;height:100%;background:var(--chalk);width:0}
.menu{display:grid;gap:8px}
.menu button{display:grid;gap:2px;text-align:left;border:1px solid var(--line);background:var(--bg);border-radius:12px;padding:12px 14px}
.menu button b{font-size:15px}
.menu button span{font-size:12px;color:var(--muted)}
.chunks{display:grid;gap:8px;margin-top:6px}

/* board list */
.sticky-top{position:sticky;top:-8px;background:var(--panel);padding:4px 0 10px;z-index:1}
.search{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--bg);font-size:16px}
.bl-h{font-size:12px;color:var(--muted);margin:12px 0 6px;letter-spacing:.06em}
.blist{display:grid;gap:4px}
.bitem{display:flex;align-items:center;gap:10px;width:100%;text-align:left;border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:9px 12px;line-height:1.35}
.bitem[aria-pressed="true"]{border-color:var(--chalk)}
.bitem .t{flex:1;min-width:0}
.bitem b{display:block;font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bitem .t span{display:block;font-size:12px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bitem small{flex:none;font-size:11px;color:var(--chalk);font-weight:700}
.bgrp{border-bottom:1px solid var(--line)}
.bgrp summary{list-style:none;display:flex;align-items:center;gap:8px;padding:13px 2px;font-weight:700;cursor:pointer}
.bgrp summary::-webkit-details-marker{display:none}
.bgrp summary small{margin-left:auto;color:var(--muted);font-weight:400}
.bgrp summary::after{content:"";width:8px;height:8px;border:solid var(--muted);border-width:0 2px 2px 0;transform:rotate(45deg);margin:0 6px 4px 4px}
.bgrp[open] summary::after{transform:rotate(-135deg);margin-bottom:-4px}
.bgrp .blist{padding-bottom:12px}
.ptable{overflow-x:auto;border:1px solid var(--line);border-radius:8px;margin:4px 0 6px}
.ptable table{border-collapse:collapse;font-size:12px;width:100%;white-space:nowrap}
.ptable th,.ptable td{padding:6px 8px;border-bottom:1px solid var(--line);text-align:left}
.ptable th{color:var(--muted);font-weight:400;background:var(--bg)}
.guide{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:12px 14px;font-size:13px;color:var(--muted);margin-top:12px}
.guide b{color:var(--ink)}
.guide ol{margin:6px 0 0;padding-left:20px}

.toast{position:fixed;left:50%;transform:translateX(-50%);top:calc(var(--st) + 56px);z-index:40;background:#eef1ec;color:#111;padding:9px 16px;border-radius:10px;font-size:14px;font-weight:700;max-width:calc(100% - 32px);box-shadow:0 6px 24px rgba(0,0,0,.4)}
@media (prefers-reduced-motion:reduce){#flash.on{animation:none}.shutter i{transition:none}}
</style>
</head>
<body>

<section id="cam">
  <div class="topbar">
    <button class="projbtn" id="projBtn"><span id="projName">工事を選択</span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M6 9l6 6 6-6"/></svg></button>
    <button class="ib" id="boardToggle" aria-pressed="true" aria-label="黒板を写す" title="黒板を写す">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="5" width="18" height="13" rx="1.5"/><path d="M3 9.5h18M9 9.5V18"/></svg>
    </button>
    <button class="ib" id="torchBtn" aria-pressed="false" aria-label="ライト" title="ライト" hidden>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M8 2h8l-1 6H9L8 2zM9 8h6v13H9z"/></svg>
    </button>
    <button class="ib" id="setBtn" aria-label="設定" title="設定">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>
    </button>
  </div>
  <div id="stage">
    <video id="video" playsinline muted autoplay></video>
    <canvas id="overlay" aria-label="ファインダー。黒板はドラッグで移動、右下の丸かピンチで拡大縮小、タップで編集"></canvas>
    <div id="flash"></div>
    <div class="zoom" id="zoomBox" hidden></div>
    <div id="camMsg" hidden><div><b id="camMsgT">カメラを起動しています</b><span id="camMsgB"></span><button class="btn primary" id="camRetry" hidden>カメラを起動</button></div></div>
  </div>
  <div class="ctrl">
    <div class="bbar" id="boardBar" role="group" aria-label="黒板の切り替え"></div>
    <div class="sokuten">
      <span class="lab">測点</span>
      <button class="step" id="sokMinus" aria-label="測点を戻す">−</button>
      <button class="val" id="sokVal" aria-label="測点を入力"></button>
      <button class="step" id="sokPlus" aria-label="測点を進める">＋</button>
    </div>
    <div class="shootrow">
      <button class="last" id="lastBtn" aria-label="撮影した写真を見る"><img id="lastImg" alt="" hidden><span class="cnt" id="lastCnt"></span></button>
      <button class="shutter" id="shutter" aria-label="撮影"><i></i></button>
      <button class="editb" id="editBtn"><span class="ib"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 20h4L19 9l-4-4L4 16v4z"/></svg></span>黒板を編集</button>
    </div>
  </div>
</section>

<section id="lib" hidden>
  <div class="lhead">
    <button class="ib" id="libBack" aria-label="カメラに戻る"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M15 6l-6 6 6 6"/></svg></button>
    <h1 id="libTitle"></h1>
    <button class="btn small" id="libSel">選択</button>
    <button class="btn small primary" id="libExport">書き出し</button>
  </div>
  <div class="lbody" id="libBody"></div>
  <div class="selbar" id="selbar" hidden>
    <button class="btn small ghost" id="selCancel">やめる</button>
    <span class="sp" id="selCount"></span>
    <button class="btn small" id="selEdit">仕分け</button>
    <button class="btn small" id="selDel">削除</button>
    <button class="btn small primary" id="selExport">書き出し</button>
  </div>
</section>

<input type="file" id="importIn" accept=".xlsx,.csv,text/csv,application/vnd.openxmlformats-officedocument.spreadsheetml.sheet" hidden>
<div id="layer"></div>
<div id="toast" class="toast" hidden></div>

<script>
(() => {
"use strict";
/* ================= constants ================= */
const KUBUN = ["着手前・完成","施工状況","安全管理","使用材料","品質管理","出来形管理","その他"];
const KOSHU = ["準備工","伐採工","移植工","植栽工","芝張工","地被植栽工","支柱工","土壌改良工","客土工","剪定工","除草工","灌水工","施設整備工","撤去工","仮設工"];
const SHUBETSU = ["高木植栽","中低木植栽","生垣植栽","地被類","張芝","播種","二脚鳥居型支柱","八ツ掛支柱","布掛支柱","根鉢","樹木検収"];
const PALETTE = {
  green:{ bg:"#285c3f", ink:"#ffffff", name:"緑" },
  white:{ bg:"#ffffff", ink:"#1b1b1b", name:"白" },
  black:{ bg:"#151515", ink:"#ffffff", name:"黒" },
  yellow:{ bg:"#f2c94c", ink:"#1b1b1b", name:"黄" }
};
const BOARD_RATIO = 0.75; /* 横4：縦3 */
const BFONT = '"Hiragino Sans","Hiragino Kaku Gothic ProN","Yu Gothic","Noto Sans JP",sans-serif';
const CHUNK = 20;

/* ================= storage (IndexedDB) ================= */
let DB;
const rq = r => new Promise((res, rej) => { r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); });
function idbOpen(){
  return new Promise((res, rej) => {
    const r = indexedDB.open("genba-kokuban", 1);
    r.onupgradeneeded = () => {
      const d = r.result;
      d.createObjectStore("projects", { keyPath:"id" });
      d.createObjectStore("boards", { keyPath:"id" }).createIndex("projectId", "projectId");
      d.createObjectStore("photos", { keyPath:"id" }).createIndex("projectId", "projectId");
      d.createObjectStore("raw");
      d.createObjectStore("kv");
    };
    r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error);
  });
}
const os = (s, m = "readonly") => DB.transaction(s, m).objectStore(s);
const idb = {
  all: s => rq(os(s).getAll()),
  by: (s, pid) => rq(os(s).index("projectId").getAll(pid)),
  get: (s, k) => rq(os(s).get(k)),
  put: (s, v, k) => rq(k === undefined ? os(s, "readwrite").put(v) : os(s, "readwrite").put(v, k)),
  del: (s, k) => rq(os(s, "readwrite").delete(k))
};
function putPhoto(rec, raw){
  return new Promise((res, rej) => {
    const t = DB.transaction(["photos","raw"], "readwrite");
    t.objectStore("photos").put(rec);
    if(raw) t.objectStore("raw").put(raw, rec.id);
    t.oncomplete = res; t.onerror = () => rej(t.error); t.onabort = () => rej(t.error);
  });
}
function delPhoto(id){
  return new Promise((res, rej) => {
    const t = DB.transaction(["photos","raw"], "readwrite");
    t.objectStore("photos").delete(id); t.objectStore("raw").delete(id);
    t.oncomplete = res; t.onerror = () => rej(t.error);
  });
}

/* ================= board drawing (shared by viewfinder and output) ================= */
/* 黒板の内容：上段＝工事名／工種・測点、大枠＝種別・細別・備考、右下＝撮影日・施工者 */
function boardData(f, iso){
  return {
    name:f.projName || "", koshu:f.koshu || "", sokuten:f.sokuten || "",
    free:[f.shubetsu, f.saibetsu, f.note].filter(Boolean),
    date:f.showDate !== false ? fmtBoardDate(iso) : "",
    con:f.showCon !== false ? (f.contractor || "") : ""
  };
}
function boardRect(pos, FW, FH){
  let w = Math.min(FW, FH) * pos.w;
  let h = w * BOARD_RATIO;
  if(h > FH){ w *= FH / h; h = FH; }
  if(w > FW){ h *= FW / w; w = FW; }
  const x = clamp(pos.x * FW, 0, FW - w), y = clamp(pos.y * FH, 0, FH - h);
  return { x, y, w, h };
}
function fitText(ctx, t, x, y, maxW, size, color, align){
  let s = size; ctx.font = `700 ${s}px ${BFONT}`;
  let m = ctx.measureText(t).width;
  if(m > maxW){ s = Math.max(size * 0.5, s * maxW / m); ctx.font = `700 ${s}px ${BFONT}`; m = ctx.measureText(t).width; }
  ctx.fillStyle = color; ctx.textAlign = align;
  if(m > maxW){ ctx.save(); ctx.translate(x, y); ctx.scale(maxW / m, 1); ctx.fillText(t, 0, 0); ctx.restore(); }
  else ctx.fillText(t, x, y);
}
/* 見出し文字を枠いっぱいに均等割り付け（工　種、測　点） */
function spreadText(ctx, t, x0, x1, y, size){
  const ch = [...t];
  ctx.font = `700 ${size}px ${BFONT}`;
  let ws = ch.map(c => ctx.measureText(c).width), tot = ws.reduce((a, b) => a + b, 0);
  if(tot > x1 - x0){ size *= (x1 - x0) / tot; ctx.font = `700 ${size}px ${BFONT}`; ws = ch.map(c => ctx.measureText(c).width); tot = ws.reduce((a, b) => a + b, 0); }
  ctx.textAlign = "left";
  if(ch.length === 1){ ctx.fillText(ch[0], (x0 + x1 - ws[0]) / 2, y); return; }
  const gap = (x1 - x0 - tot) / (ch.length - 1);
  let x = x0;
  ch.forEach((c, i) => { ctx.fillText(c, x, y); x += ws[i] + gap; });
}
function wrapText(ctx, t, maxW){
  const out = [];
  String(t).split(/\r?\n/).forEach(par => {
    let line = "";
    for(const c of par){
      if(line && ctx.measureText(line + c).width > maxW){ out.push(line); line = c; } else line += c;
    }
    out.push(line);
  });
  return out;
}
function drawBoard(ctx, d, x, y, w, color){
  const P = PALETTE[color] || PALETTE.green, h = w * BOARD_RATIO;
  const m = w * 0.013, lw = Math.max(1, w * 0.0038);
  const fx = x + m, fy = y + m, fw = w - m * 2, fh = h - m * 2, rh = fw * 0.105, ip = rh * 0.16;
  const c1 = fx + fw * 0.21, c2 = fx + fw * 0.50, c3 = fx + fw * 0.71;
  ctx.save();
  ctx.fillStyle = P.bg; ctx.fillRect(x, y, w, h);
  ctx.strokeStyle = P.ink; ctx.lineWidth = lw;
  ctx.strokeRect(fx, fy, fw, fh);
  ctx.beginPath();
  ctx.moveTo(fx, fy + rh); ctx.lineTo(fx + fw, fy + rh);
  ctx.moveTo(fx, fy + rh * 2); ctx.lineTo(fx + fw, fy + rh * 2);
  ctx.moveTo(c1, fy); ctx.lineTo(c1, fy + rh * 2);
  ctx.moveTo(c2, fy + rh); ctx.lineTo(c2, fy + rh * 2);
  ctx.moveTo(c3, fy + rh); ctx.lineTo(c3, fy + rh * 2);
  ctx.stroke();
  ctx.textBaseline = "middle"; ctx.fillStyle = P.ink;
  const lab = rh * 0.56, val = rh * 0.5, r1 = fy + rh / 2, r2 = fy + rh * 1.5;
  spreadText(ctx, "工事名", fx + ip, c1 - ip, r1, lab);
  spreadText(ctx, "工種", fx + ip, c1 - ip, r2, lab);
  spreadText(ctx, "測点", c2 + ip, c3 - ip, r2, lab);
  fitText(ctx, d.name, c1 + ip * 1.5, r1, fx + fw - c1 - ip * 3, val, P.ink, "left");
  fitText(ctx, d.koshu, c1 + ip * 1.5, r2, c2 - c1 - ip * 3, val, P.ink, "left");
  fitText(ctx, d.sokuten, c3 + ip * 1.5, r2, fx + fw - c3 - ip * 3, val, P.ink, "left");
  /* 大枠 */
  const ax = fx + ip * 2, aw = fw - ip * 4, ay = fy + rh * 2, ah = fh - rh * 2;
  const foot = [d.date && "撮影日　" + d.date, d.con && "施工者　" + d.con].filter(Boolean);
  const fs = rh * 0.4, fl = fs * 1.45, footH = foot.length ? foot.length * fl + ip : 0;
  foot.forEach((t, i) => fitText(ctx, t, fx + fw - ip * 2, fy + fh - ip - (foot.length - 1 - i) * fl - fl / 2, aw, fs, P.ink, "right"));
  const avail = ah - footH - ip * 2;
  let size = val * 1.1, lines = [];
  for(let k = 0; k < 12; k++){
    ctx.font = `700 ${size}px ${BFONT}`;
    lines = []; d.free.forEach(t => lines.push(...wrapText(ctx, t, aw)));
    if(lines.length * size * 1.4 <= avail) break;
    size *= 0.9;
  }
  ctx.textAlign = "left";
  lines.forEach((t, i) => { const yy = ay + ip * 1.5 + size * 0.7 + i * size * 1.4; if(yy + size * 0.5 <= ay + ah - footH) ctx.fillText(t, ax, yy); });
  ctx.restore();
  return h;
}
function liveFields(){
  const b = curB() || {}, p = curP() || {};
  return { projName:p.name || "", contractor:p.contractor || "", koshu:b.koshu, shubetsu:b.shubetsu, saibetsu:b.saibetsu, sokuten:b.sokuten, note:b.note, showDate:S.set.showDate, showCon:S.set.showCon };
}
async function renderPhoto(rec, raw, maxSide){
  const bmp = await createImageBitmap(raw);
  const s = maxSide ? Math.min(1, maxSide / Math.max(bmp.width, bmp.height)) : 1;
  const W = Math.round(bmp.width * s), H = Math.round(bmp.height * s);
  const c = document.createElement("canvas"); c.width = W; c.height = H;
  const ctx = c.getContext("2d"); ctx.drawImage(bmp, 0, 0, W, H); if(bmp.close) bmp.close();
  if(rec.showBoard !== false){ const r = boardRect(rec.pos, W, H); drawBoard(ctx, boardData(rec, rec.takenAt), r.x, r.y, r.w, rec.color); }
  return c;
}
const toBlob = (c, q = 0.9) => new Promise(r => c.toBlob(r, "image/jpeg", q));
async function scaled(src, max){
  const s = Math.min(1, max / Math.max(src.width, src.height));
  const c = document.createElement("canvas"); c.width = Math.round(src.width * s); c.height = Math.round(src.height * s);
  c.getContext("2d").drawImage(src, 0, 0, c.width, c.height);
  return c;
}

/* ================= camera ================= */
const video = $("#video"), overlay = $("#overlay");
function camMsg(title, body, retry){
  $("#camMsg").hidden = !title;
  if(!title) return;
  $("#camMsgT").textContent = title; $("#camMsgB").textContent = body || ""; $("#camRetry").hidden = !retry;
}
async function startCam(){
  if(S.stream || S.starting || S.screen !== "cam" || document.hidden) return;
  S.starting = true;
  try{ await openCam(); } finally { S.starting = false; }
}
async function openCam(){
  if(!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia){
    camMsg("この画面ではカメラを使えません", "iPhoneのSafariで、https:// から始まるアドレスで開いてください。", false); return;
  }
  camMsg("カメラを起動しています", "", false);
  const tries = [
    { video:{ facingMode:{ ideal:"environment" }, width:{ ideal:4032 }, height:{ ideal:3024 } }, audio:false },
    { video:{ facingMode:{ ideal:"environment" } }, audio:false }
  ];
  let err;
  for(const c of tries){ try{ S.stream = await navigator.mediaDevices.getUserMedia(c); break; }catch(e){ err = e; if(e.name === "NotAllowedError") break; } }
  if(!S.stream){
    if(err && err.name === "NotAllowedError") camMsg("カメラの使用が許可されていません", "iPhoneの「設定」→「Safari」→「カメラ」を「許可」にしてから、下のボタンを押してください。", true);
    else camMsg("カメラを起動できませんでした", "ほかのアプリがカメラを使っていないか確認して、もう一度お試しください。", true);
    return;
  }
  S.track = S.stream.getVideoTracks()[0];
  S.track.addEventListener("ended", () => { S.stream = null; S.track = null; setTimeout(resumeCam, 300); });
  video.srcObject = S.stream;
  try{ await video.play(); }catch(e){}
  camMsg(null);
  setupCaps();
}
function stopCam(){
  if(S.stream){ S.stream.getTracks().forEach(t => t.stop()); S.stream = null; S.track = null; video.srcObject = null; }
}
function setupCaps(){
  const caps = S.track && S.track.getCapabilities ? S.track.getCapabilities() : {};
  $("#torchBtn").hidden = !caps.torch;
  const zb = $("#zoomBox");
  if(caps.zoom && caps.zoom.max > 1){
    const levels = [1, 2, 5].filter(z => z >= caps.zoom.min && z <= caps.zoom.max);
    if(caps.zoom.min < 1) levels.unshift(caps.zoom.min);
    zb.innerHTML = levels.map(z => `<button data-z="${z}" aria-pressed="${z === 1}">${z < 1 ? (Math.round(z * 10) / 10) : z}×</button>`).join("");
    zb.hidden = false;
    zb.querySelectorAll("button").forEach(b => b.onclick = () => {
      S.track.applyConstraints({ advanced:[{ zoom:+b.dataset.z }] }).then(() => {
        zb.querySelectorAll("button").forEach(x => x.setAttribute("aria-pressed", x === b));
      }).catch(() => {});
    });
  } else zb.hidden = true;
}
$("#torchBtn").onclick = e => {
  const on = e.currentTarget.getAttribute("aria-pressed") !== "true";
  S.track && S.track.applyConstraints({ advanced:[{ torch:on }] }).then(() => e.currentTarget.setAttribute("aria-pressed", on)).catch(() => toast("ライトを使えませんでした"));
};
$("#camRetry").onclick = () => { stopCam(); startCam(); };
if(navigator.permissions && navigator.permissions.query){
  navigator.permissions.query({ name:"camera" }).then(st => { S.camPerm = st.state; st.onchange = () => { S.camPerm = st.state; }; }).catch(() => {});
}
video.addEventListener("loadedmetadata", drawOverlay);
video.addEventListener("resize", drawOverlay);
/* カメラは止めずに持ち続ける（止めて起動し直すと、iPhoneでは許可を聞き直されることがあるため） */
function camAlive(){ return S.stream && S.track && S.track.readyState === "live"; }
function resumeCam(){
  if(S.screen !== "cam" || document.hidden) return;
  if(camAlive()){ video.play().catch(() => {}); return; }
  S.stream = null; S.track = null; startCam();
}
document.addEventListener("visibilitychange", resumeCam);
window.addEventListener("pageshow", resumeCam);

function videoRect(){
  const st = $("#stage"), W = st.clientWidth, H = st.clientHeight, vw = video.videoWidth, vh = video.videoHeight;
  if(!vw || !vh) return null;
  const s = Math.min(W / vw, H / vh), w = vw * s, h = vh * s;
  return { x:(W - w) / 2, y:(H - h) / 2, w, h };
}
function drawOverlay(){
  const st = $("#stage"), dpr = window.devicePixelRatio || 1, W = st.clientWidth, H = st.clientHeight;
  if(overlay.width !== Math.round(W * dpr) || overlay.height !== Math.round(H * dpr)){ overlay.width = Math.round(W * dpr); overlay.height = Math.round(H * dpr); }
  const ctx = overlay.getContext("2d");
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0); ctx.clearRect(0, 0, W, H);
  S.vr = videoRect(); S.br = null;
  if(!S.vr || !S.set.showBoard || !curB()) return;
  const vr = S.vr, bd = boardData(liveFields(), localISO(new Date())), r = boardRect(S.set.pos, vr.w, vr.h);
  S.br = { x:vr.x + r.x, y:vr.y + r.y, w:r.w, h:r.h };
  drawBoard(ctx, bd, S.br.x, S.br.y, r.w, S.set.color);
  const hx = S.br.x + S.br.w, hy = S.br.y + S.br.h;
  ctx.fillStyle = "rgba(255,255,255,.95)"; ctx.strokeStyle = "rgba(0,0,0,.45)"; ctx.lineWidth = 1.5;
  ctx.beginPath(); ctx.arc(clamp(hx, 10, W - 10), clamp(hy, 10, H - 10), 9, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
}
window.addEventListener("resize", () => requestAnimationFrame(drawOverlay));
setInterval(() => { if(S.screen === "cam") drawOverlay(); }, 30000);

/* board drag / resize / pinch / tap */
const ptrs = new Map(); let gest = null;
const local = e => { const r = overlay.getBoundingClientRect(); return { x:e.clientX - r.left, y:e.clientY - r.top }; };
overlay.addEventListener("pointerdown", e => {
  overlay.setPointerCapture(e.pointerId);
  const p = local(e); ptrs.set(e.pointerId, p);
  if(ptrs.size === 2){ const [a, b] = [...ptrs.values()]; gest = { type:"pinch", d0:Math.hypot(a.x - b.x, a.y - b.y) || 1, w0:S.set.pos.w }; return; }
  if(!S.br) { gest = null; return; }
  const B = S.br, nearH = Math.hypot(p.x - (B.x + B.w), p.y - (B.y + B.h)) < 36;
  const inB = p.x >= B.x && p.x <= B.x + B.w && p.y >= B.y && p.y <= B.y + B.h;
  if(nearH) gest = { type:"resize", sx:p.x, w0:S.set.pos.w };
  else if(inB) gest = { type:"move", sx:p.x, sy:p.y, bx:B.x, by:B.y, t:Date.now(), moved:false };
  else gest = null;
});
overlay.addEventListener("pointermove", e => {
  if(!ptrs.has(e.pointerId)) return;
  const p = local(e); ptrs.set(e.pointerId, p);
  if(!gest || !S.vr) return;
  const vr = S.vr, sh = Math.min(vr.w, vr.h);
  if(gest.type === "move"){
    const dx = p.x - gest.sx, dy = p.y - gest.sy;
    if(Math.hypot(dx, dy) > 6) gest.moved = true;
    if(!gest.moved) return;
    S.set.pos.x = (gest.bx + dx - vr.x) / vr.w; S.set.pos.y = (gest.by + dy - vr.y) / vr.h;
  } else if(gest.type === "resize"){
    S.set.pos.w = clamp(gest.w0 + (p.x - gest.sx) / sh, 0.2, 0.95);
  } else if(gest.type === "pinch" && ptrs.size === 2){
    const [a, b] = [...ptrs.values()];
    S.set.pos.w = clamp(gest.w0 * Math.hypot(a.x - b.x, a.y - b.y) / gest.d0, 0.2, 0.95);
  }
  drawOverlay();
});
function endPtr(e){
  if(!ptrs.has(e.pointerId)) return;
  ptrs.delete(e.pointerId);
  if(gest && gest.type === "move" && !gest.moved && e.type === "pointerup" && Date.now() - gest.t < 400){ gest = null; boardSheet(); return; }
  if(ptrs.size === 0 && gest){
    if(S.br && S.vr){ S.set.pos.x = (S.br.x - S.vr.x) / S.vr.w; S.set.pos.y = (S.br.y - S.vr.y) / S.vr.h; }
    gest = null; saveKV();
  }
}
overlay.addEventListener("pointerup", endPtr);
overlay.addEventListener("pointercancel", endPtr);

/* ================= shooting ================= */
let persistAsked = false;
async function shoot(){
  if(S.busy) return;
  const p = curP(), b = curB();
  if(!p){ projectSheet(true); return; }
  if(!video.videoWidth){ toast("カメラの準備ができていません"); return; }
  S.busy = true;
  const fl = $("#flash"); fl.classList.remove("on"); void fl.offsetWidth; fl.classList.add("on");
  try{
    const W = video.videoWidth, H = video.videoHeight;
    const c = document.createElement("canvas"); c.width = W; c.height = H;
    const ctx = c.getContext("2d"); ctx.drawImage(video, 0, 0, W, H);
    const raw = await toBlob(c, 0.92);
    const bb = b || {};
    const rec = {
      id:uid(), projectId:p.id, takenAt:localISO(new Date()), createdAt:Date.now(), w:W, h:H,
      projName:p.name, contractor:p.contractor || "",
      kubun:bb.kubun || "", koshu:bb.koshu || "", shubetsu:bb.shubetsu || "", saibetsu:bb.saibetsu || "", sokuten:bb.sokuten || "", note:bb.note || "",
      pos:{ ...S.set.pos }, color:S.set.color, showBoard:S.set.showBoard && !!b, showDate:S.set.showDate, showCon:S.set.showCon
    };
    if(rec.showBoard){ const r = boardRect(rec.pos, W, H); drawBoard(ctx, boardData(rec, rec.takenAt), r.x, r.y, r.w, rec.color); }
    rec.thumb = await toBlob(await scaled(c, 360), 0.8);
    await putPhoto(rec, raw);
    S.photos.push(rec);
    renderLast();
    if(S.set.autoAdv && b) await stepSokuten(1);
    if(!persistAsked && navigator.storage && navigator.storage.persist){ persistAsked = true; navigator.storage.persist().catch(() => {}); }
  }catch(e){
    toast("保存できませんでした。iPhoneの空き容量を確認してください。", 5000);
  }
  S.busy = false;
}
function thumbUrl(rec){
  if(!S.urls.has(rec.id) && rec.thumb) S.urls.set(rec.id, URL.createObjectURL(rec.thumb));
  return S.urls.get(rec.id) || "";
}
function dropUrl(id){ const u = S.urls.get(id); if(u){ URL.revokeObjectURL(u); S.urls.delete(id); } }
function renderLast(){
  const list = S.photos, last = list.reduce((a, x) => (!a || x.createdAt > a.createdAt) ? x : a, null);
  const img = $("#lastImg");
  if(last){ img.src = thumbUrl(last); img.hidden = false; } else { img.hidden = true; img.removeAttribute("src"); }
  $("#lastCnt").textContent = list.length ? list.length : "";
}

/* ================= boards ================= */
function bumpNum(s, step){
  const str = String(s || "");
  const m = str.match(/^(.*?)(\d+)(\D*)$/);
  if(!m) return str ? str + step : "No." + Math.max(0, step);
  const n = Math.max(0, parseInt(m[2], 10) + step);
  return m[1] + String(n).padStart(m[2].length, "0") + m[3];
}
async function saveBoard(b){ b.updatedAt = Date.now(); await idb.put("boards", b); }
async function stepSokuten(dir){
  const b = curB(); if(!b) return;
  b.sokuten = bumpNum(b.sokuten, dir * (Number(S.set.step) || 1));
  await saveBoard(b); renderCam();
}
function newBoard(from){
  return { id:uid(), projectId:S.pid, createdAt:Date.now(), order:Date.now(),
    kubun:from?.kubun || "施工状況", koshu:from?.koshu || "", shubetsu:from?.shubetsu || "", saibetsu:from?.saibetsu || "", sokuten:from?.sokuten || "", note:from?.note || "" };
}
function selectBoard(id){
  S.bid = id; S.lastBid[S.pid] = id; saveKV();
  const b = curB(); if(b){ b.lastUsed = Date.now(); idb.put("boards", b).catch(() => {}); }
  renderCam();
}
async function normalizeOrder(){
  const t = DB.transaction("boards", "readwrite"), st = t.objectStore("boards");
  S.boards.forEach((b, i) => { b.order = i; st.put(b); });
  await new Promise(r => { t.oncomplete = r; t.onerror = r; });
}
async function duplicateBoard(){
  if(!curP()){ projectSheet(true); return; }
  const b = curB(), i = S.boards.indexOf(b), next = S.boards[i + 1];
  const nb = newBoard(b);
  nb.order = b ? (next ? (b.order + next.order) / 2 : b.order + 1) : 0;
  await saveBoard(nb);
  S.boards.splice(i + 1, 0, nb);
  if(next && Math.abs(next.order - nb.order) < 1e-6) await normalizeOrder();
  selectBoard(nb.id); boardSheet(true);
}
function moveBoard(dir){
  const i = S.boards.findIndex(x => x.id === S.bid), j = i + dir;
  if(j >= 0 && j < S.boards.length) selectBoard(S.boards[j].id);
}
function boardLabel(b){ return [b.koshu, b.shubetsu].filter(Boolean).join("・") || "（未入力の黒板）"; }

function renderCam(){
  const p = curP(), b = curB();
  $("#projName").textContent = p ? p.name : "工事を登録";

  ["#sokMinus","#sokPlus","#sokVal"].forEach(s => $(s).disabled = !b);

  drawOverlay();
}

/* ================= sheets ================= */
function openSheet(html, mount, opts = {}){
  const L = $("#layer");
  L.innerHTML = `<div class="scrim" id="scrim"><div class="sheet" role="dialog" aria-modal="true"><div class="grab"></div>${html}</div></div>`;
  if(!opts.locked) $("#scrim").addEventListener("click", e => { if(e.target.id === "scrim" && !S.sheetBusy) closeSheet(); });
  if(mount) mount();
}
function closeSheet(){ $("#layer").innerHTML = ""; S.sheetBusy = false; if(S.onClose){ const f = S.onClose; S.onClose = null; f(); } }

function suggestions(field, base){
  const set = new Set();
  [...S.boards, ...S.photos].forEach(x => x[field] && set.add(x[field]));
  (base || []).forEach(v => set.add(v));
  return [...set].slice(0, 40);
}
function fieldHTML(id, label, val, base, opt = {}){
  const sug = suggestions(id, base);
  return `<div class="f"><label for="f_${id}"><span>${label}</span>${opt.right || ""}</label>
    <input id="f_${id}" value="${esc(val || "")}" autocomplete="off" ${opt.ph ? `placeholder="${esc(opt.ph)}"` : ""} ${opt.mode ? `inputmode="${opt.mode}"` : ""}>
    ${sug.length ? `<div class="sugg" data-for="f_${id}">${sug.map(v => `<button type="button">${esc(v)}</button>`).join("")}</div>` : ""}</div>`;
}
function kubunHTML(val, keep){
  return `<div class="f"><label><span>写真区分</span></label><div class="seg" id="f_kubun" data-val="${esc(keep ? "__keep" : (val || ""))}">
    ${keep ? `<button type="button" data-v="__keep" aria-pressed="true">変更しない</button>` : ""}
    ${KUBUN.map(k => `<button type="button" data-v="${esc(k)}" aria-pressed="${!keep && val === k}">${esc(k)}</button>`).join("")}</div></div>`;
}
function bindFieldUI(){
  document.querySelectorAll(".sugg").forEach(s => s.querySelectorAll("button").forEach(b => b.onclick = () => {
    const inp = document.getElementById(s.dataset.for); inp.value = b.textContent; inp.dispatchEvent(new Event("input"));
  }));
  const seg = $("#f_kubun");
  if(seg) seg.querySelectorAll("button").forEach(b => b.onclick = () => {
    seg.dataset.val = b.dataset.v; seg.querySelectorAll("button").forEach(x => x.setAttribute("aria-pressed", x === b));
    seg.dispatchEvent(new Event("input", { bubbles:true }));
  });
}
const FIELDS = ["koshu","shubetsu","saibetsu","sokuten","note"];
function readFields(keep){
  const o = {}, k = $("#f_kubun").dataset.val;
  if(!(keep && k === "__keep")) o.kubun = k;
  FIELDS.forEach(f => { const el = $("#f_" + f); if(!el) return; const v = el.value.trim(); if(!(keep && v === "")) o[f] = v; });
  return o;
}

async function loadProject(pid){
  S.pid = pid; S.filter = "all"; S.sel = null;
  S.urls.forEach(u => URL.revokeObjectURL(u)); S.urls.clear();
  if(!pid){ S.boards = []; S.photos = []; S.bid = null; renderCam(); return; }
  S.boards = (await idb.by("boards", pid)).sort((a, b) => a.order - b.order);
  S.photos = await idb.by("photos", pid);
  if(!S.boards.length){ const nb = newBoard(); await saveBoard(nb); S.boards.push(nb); }
  S.bid = S.boards.find(b => b.id === S.lastBid[pid]) ? S.lastBid[pid] : S.boards[S.boards.length - 1].id;
  saveKV(); renderCam(); if(S.screen === "lib") renderLib();
}

/* --- Excel / CSV import --- */
const COLS = { kubun:["写真区分","区分"], koshu:["工種"], shubetsu:["種別"], saibetsu:["細別","樹種","規格"], sokuten:["測点","位置"], note:["備考","記事"] };
function cellText(v){
  if(v == null) return "";
  if(v instanceof Date) return localISO(v).slice(0, 10);
  if(typeof v === "object"){
    if(v.richText) return v.richText.map(t => t.text).join("").trim();
    if("result" in v) return cellText(v.result);
    if(v.text != null) return cellText(v.text);
    return "";
  }
  return String(v).trim();
}
function mapHeader(cells){
  const m = {};
  cells.forEach((c, i) => {
    const t = String(c || "").replace(/\s/g, "");
    if(!t) return;
    for(const [k, names] of Object.entries(COLS)) if(m[k] === undefined && names.some(n => t.startsWith(n))){ m[k] = i; break; }
  });
  return (m.koshu !== undefined || m.shubetsu !== undefined || m.sokuten !== undefined) ? m : null;
}
function rowsToBoards(rows){
  let hi = -1, map = null;
  for(let i = 0; i < Math.min(rows.length, 15); i++){ map = mapHeader(rows[i] || []); if(map){ hi = i; break; } }
  if(!map) throw new Error("見出し行が見つかりません。1行目に「工種」「種別」「細別」「測点」などの見出しを入れてください。");
  const out = [];
  for(let i = hi + 1; i < rows.length; i++){
    const r = rows[i] || [], get = k => map[k] === undefined ? "" : String(r[map[k]] ?? "").trim();
    const o = { kubun:get("kubun"), koshu:get("koshu"), shubetsu:get("shubetsu"), saibetsu:get("saibetsu"), sokuten:get("sokuten"), note:get("note") };
    if(!o.koshu && !o.shubetsu && !o.saibetsu && !o.sokuten && !o.note) continue;
    o.kubun = !o.kubun ? "施工状況" : KUBUN.includes(o.kubun) ? o.kubun : (KUBUN.find(k => k.includes(o.kubun) || o.kubun.includes(k)) || "その他");
    out.push(o);
  }
  if(!out.length) throw new Error("見出しの下に黒板の内容が入っていません。");
  return out;
}
async function readXlsx(file){
  await loadScript("vendor/exceljs.min.js");
  const wb = new ExcelJS.Workbook();
  await wb.xlsx.load(await file.arrayBuffer());
  const ws = wb.worksheets.find(w => w.state !== "hidden" && w.state !== "veryHidden" && w.rowCount > 0) || wb.worksheets[0];
  const rows = [];
  ws.eachRow({ includeEmpty:true }, (row, rn) => { const a = []; row.eachCell({ includeEmpty:true }, (c, cn) => { a[cn - 1] = cellText(c.value); }); rows[rn - 1] = a; });
  return Array.from(rows, r => r || []);
}
function parseCsv(t){
  const rows = []; let row = [], f = "", q = false;
  for(let i = 0; i < t.length; i++){
    const c = t[i];
    if(q){ if(c === '"'){ if(t[i + 1] === '"'){ f += '"'; i++; } else q = false; } else f += c; }
    else if(c === '"') q = true;
    else if(c === ","){ row.push(f); f = ""; }
    else if(c === "\n" || c === "\r"){ if(c === "\r" && t[i + 1] === "\n") i++; row.push(f); rows.push(row); row = []; f = ""; }
    else f += c;
  }
  if(f || row.length){ row.push(f); rows.push(row); }
  return rows.map(r => r.map(s => s.trim()));
}
async function readCsv(file){
  const buf = await file.arrayBuffer(); let text;
  try{ text = new TextDecoder("utf-8", { fatal:true }).decode(buf); }
  catch(e){ text = new TextDecoder("shift_jis").decode(buf); }
  return parseCsv(text.replace(/^﻿/, ""));
}

$("#importIn").onchange = async e => {

    if(/\.xls$/i.test(file.name)) throw new Error("古い形式（.xls）は読み込めません。Excelで「名前を付けて保存」から .xlsx 形式で保存し直してください。");
    const rows = /\.csv$/i.test(file.name) || file.type === "text/csv" ? await readCsv(file) : await readXlsx(file);
    list = rowsToBoards(rows);
  }catch(err){
    openSheet(`<h3>取り込めませんでした</h3><p class="lead">${esc(err && err.message && /[ぁ-んァ-ン一-龥]/.test(err.message) ? err.message : "ファイルを読み込めませんでした。Excel（.xlsx）かCSVファイルを選んでください。")}</p><div class="actions"><span class="sp"></span><button class="btn" id="eBack">戻る</button></div>`, () => { $("#eBack").onclick = importSheet; });

    $("#iCancel").onclick = closeSheet;

      const nbs = list.map((o, i) => ({ id:uid(), projectId:S.pid, createdAt:now, order:base + i, ...o }));

async function buildTemplate(){

async function templateBuffer(XL){
  const wb = new XL.Workbook();
  const ws = wb.addWorksheet("黒板リスト", { views:[{ state:"frozen", ySplit:1 }] });
  ws.columns = [
    { header:"写真区分", width:14 }, { header:"工種", width:14 }, { header:"種別", width:16 },
    { header:"細別", width:26 }, { header:"測点", width:12 }, { header:"備考", width:28 }
  ];
  [
    ["施工状況","植栽工","高木植栽","ケヤキ H5.0 C0.30 W1.5","No.1",""],
    ["施工状況","植栽工","高木植栽","ケヤキ H5.0 C0.30 W1.5","No.2",""],
    ["施工状況","支柱工","八ツ掛支柱","丸太 φ60 L4.0","No.1",""],
    ["出来形管理","植栽工","中低木植栽","ツツジ H0.5 W0.4","A区画","植栽密度 4本/㎡"]
  ].forEach(r => ws.addRow(r));
  const hd = ws.getRow(1);
  hd.font = { bold:true, color:{ argb:"FFFFFFFF" } }; hd.height = 22;
  hd.eachCell(c => { c.fill = { type:"pattern", pattern:"solid", fgColor:{ argb:"FF2F5141" } }; c.alignment = { vertical:"middle", horizontal:"center" }; });
  for(let r = 2; r <= 1000; r++) ws.getCell(r, 1).dataValidation = { type:"list", allowBlank:true, formulae:['"' + KUBUN.join(",") + '"'], showErrorMessage:true, errorTitle:"写真区分", error:"一覧から選んでください" };
  const help = wb.addWorksheet("使い方");
  help.getColumn(1).width = 90;
  [
    "黒板リストの使い方",
    "",
    "・「黒板リスト」シートの2行目から、1行に黒板1枚分を入力します（例の行は消して上書きしてください）。",
    "・写真区分は一覧から選びます。空欄なら「施工状況」になります。",
    "・見出し（1行目）の名前は変えないでください。列の順番の入れ替えや、ほかの列の追加は問題ありません。",
    "・保存したファイルをiPhoneの「ファイル」アプリ（iCloud Driveなど）に置き、現場黒板の「黒板の一覧」→「Excelから取り込み」で選びます。",
    "・取り込んだ黒板は表の並び順に入ります。撮影画面の ‹ › ボタンで順番に切り替えられます。"
  ].forEach((t, i) => { const c = help.getCell(i + 1, 1); c.value = t; if(i === 0) c.font = { bold:true, size:14 }; });
  return wb.xlsx.writeBuffer();
}

function show(screen){
  S.screen = screen;
  $("#cam").hidden = screen !== "cam"; $("#lib").hidden = screen !== "lib";

}

function sortPhotos(list){
  const ki = k => { const i = KUBUN.indexOf(k); return i < 0 ? 99 : i; };
  return [...list].sort((a, b) => ki(a.kubun) - ki(b.kubun)
    || (a.koshu || "").localeCompare(b.koshu || "", "ja")
    || (a.shubetsu || "").localeCompare(b.shubetsu || "", "ja")
    || (a.takenAt || "").localeCompare(b.takenAt || "")
    || a.createdAt - b.createdAt);
}
const shown = () => sortPhotos(S.photos).filter(x => S.filter === "all" || (x.kubun || "未分類") === S.filter);
function renderLib(){
  const p = curP(), list = S.photos;
  $("#libTitle").innerHTML = `${esc(p ? p.name : "")}<small>${list.length}枚</small>`;
  $("#libSel").hidden = !!S.sel || !list.length; $("#libExport").hidden = !!S.sel || !list.length;
  $("#selbar").hidden = !S.sel;
  if(S.sel) $("#selCount").textContent = `${S.sel.size}枚を選択`;
  const body = $("#libBody");
  if(!list.length){ body.innerHTML = `<p class="empty">まだ写真がありません。<br>カメラに戻って撮影してください。</p>`; return; }
  const counts = {}; list.forEach(x => { const k = x.kubun || "未分類"; counts[k] = (counts[k] || 0) + 1; });
  const keys = [...KUBUN, "未分類"].filter(k => counts[k]);
  if(S.filter !== "all" && !counts[S.filter]) S.filter = "all";
  let h = `<div class="chips"><button class="chip" data-f="all" aria-pressed="${S.filter === "all"}">すべて<span class="c">${list.length}</span></button>${keys.map(k => `<button class="chip" data-f="${esc(k)}" aria-pressed="${S.filter === k}">${esc(k)}<span class="c">${counts[k]}</span></button>`).join("")}</div>`;
  const groups = new Map();
  shown().forEach(x => {
    const k = x.kubun || "未分類", ks = x.koshu || "工種なし";
    if(!groups.has(k)) groups.set(k, new Map());
    const g = groups.get(k); if(!g.has(ks)) g.set(ks, []); g.get(ks).push(x);
  });
  groups.forEach((g, k) => {
    const n = [...g.values()].reduce((a, b) => a + b.length, 0);
    h += `<section class="group"><h2><b>${esc(k)}</b>${n}枚</h2>`;
    g.forEach((arr, ks) => {
      h += `<div class="sub">${esc(ks)}</div><div class="grid">${arr.map(x => {
        const on = S.sel && S.sel.has(x.id);
        return `<button class="tile${on ? " sel" : ""}" data-id="${esc(x.id)}"><img src="${thumbUrl(x)}" alt="" loading="lazy"><span class="meta">${esc([x.shubetsu, x.sokuten].filter(Boolean).join("・") || fmtDate(x.takenAt))}</span>${S.sel ? `<span class="tick"></span>` : ""}</button>`;
      }).join("")}</div>`;
    });
    h += `</section>`;
  });
  body.innerHTML = h;
  body.querySelectorAll(".chip").forEach(c => c.onclick = () => { S.filter = c.dataset.f; renderLib(); });
  body.querySelectorAll(".tile").forEach(t => t.onclick = () => {
    const id = t.dataset.id;
    if(S.sel){ S.sel.has(id) ? S.sel.delete(id) : S.sel.add(id); renderLib(); }
    else photoSheet(S.photos.find(x => x.id === id));
  });
}

  if(!S.sel.size){ toast("写真を選んでください"); return; }
  if(!b.dataset.armed){ b.dataset.armed = 1; b.textContent = `${S.sel.size}枚を削除`; setTimeout(() => { b.textContent = "削除"; delete b.dataset.armed; }, 4000); return; }
  delete b.dataset.armed; b.textContent = "削除";
  removePhotos([...S.sel]);
};
async function removePhotos(ids){
  for(const id of ids){ await delPhoto(id); dropUrl(id); }
  S.photos = S.photos.filter(x => !ids.includes(x.id)); S.sel = null;
  toast(`${ids.length}枚を削除しました`); renderLib(); renderLast();
}
async function rethumb(rec){
  const raw = await idb.get("raw", rec.id); if(!raw) return;
  const c = await renderPhoto(rec, raw, 900);
  rec.thumb = await toBlob(await scaled(c, 360), 0.8); dropUrl(rec.id);
}

/* ================= export ================= */
const loaded = {};
function loadScript(src){
  if(!loaded[src]) loaded[src] = new Promise((res, rej) => { const s = document.createElement("script"); s.src = src; s.onload = res; s.onerror = () => { delete loaded[src]; rej(new Error("load")); }; document.head.appendChild(s); });
  return loaded[src];
}
const safe = s => String(s || "").replace(/[\\/:*?"<>|\r\n\t]/g, "_").trim();
function fileBase(rec){
  const d = (rec.takenAt || "").replace(/[-:]/g, "").replace("T", "_");
  return [d, safe(rec.koshu), safe(rec.shubetsu), safe(rec.sokuten)].filter(Boolean).join("_") || "photo";
}
function uniqueNames(list){
  const used = new Map();
  return list.map(r => { const b = fileBase(r); const n = (used.get(b) || 0) + 1; used.set(b, n); return n > 1 ? `${b}_${n}.jpg` : `${b}.jpg`; });
}
async function binStr(blob){
  const u8 = new Uint8Array(await blob.arrayBuffer()); let s = "";
  for(let i = 0; i < u8.length; i += 32768) s += String.fromCharCode.apply(null, u8.subarray(i, i + 32768));
  return s;
}
function strBlob(s){ const u8 = new Uint8Array(s.length); for(let i = 0; i < s.length; i++) u8[i] = s.charCodeAt(i) & 255; return new Blob([u8], { type:"image/jpeg" }); }
async function withExif(blob, iso){
  try{
    await loadScript("vendor/piexif.js");
    const dt = (iso || "").replace("T", " ").replace(/-/g, ":") + ":00";
    const ex = piexif.dump({ "0th":{ [piexif.ImageIFD.DateTime]:dt, [piexif.ImageIFD.Software]:"Genba Kokuban" }, "Exif":{ [piexif.ExifIFD.DateTimeOriginal]:dt, [piexif.ExifIFD.DateTimeDigitized]:dt } });
    return strBlob(piexif.insert(ex, await binStr(blob)));
  }catch(e){ return blob; }
}
async function photoFile(rec, name, maxSide){
  const raw = await idb.get("raw", rec.id);
  if(!raw) throw new Error("missing");
  const c = await renderPhoto(rec, raw, maxSide);
  const b = await withExif(await toBlob(c, 0.9), rec.takenAt);
  return new File([b], name, { type:"image/jpeg" });
}
function downloadFile(f){
  const a = document.createElement("a"); a.href = URL.createObjectURL(f); a.download = f.name;
  document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 60000);
}
async function deliver(files){
  if(navigator.canShare && navigator.share && navigator.canShare({ files })){
    try{ await navigator.share({ files }); return "shared"; }
    catch(e){ if(e.name === "AbortError") return "cancel"; }
  }
  files.forEach(downloadFile); return "downloaded";
}

  });
}

/* prepare first, then a separate tap hands the file to the share sheet (iOS requires a fresh tap) */
function prepSheet(title, list, build, startMsg){
  openSheet(`<h3>${title}</h3><p class="lead" id="pMsg">${startMsg || list.length + "枚から作成しています…"}</p><div class="progress"><i id="pBar"></i></div>
    <div class="actions"><button class="btn ghost" id="pCancel">やめる</button><span class="sp"></span><button class="btn primary" id="pGo" hidden>保存する</button></div>`, async () => {
    let cancelled = false, file = null;
    S.sheetBusy = true;
    $("#pCancel").onclick = () => { cancelled = true; closeSheet(); };
    const prog = (i, n) => { if(!cancelled){ $("#pBar").style.width = (i / n * 100) + "%"; $("#pMsg").textContent = `${i} / ${n} 枚を処理中…`; } return cancelled; };
    try{ file = await build(list, prog); }
    catch(e){ if(!cancelled){ $("#pMsg").textContent = "作成できませんでした。枚数を減らして（写真区分で絞り込むか、選択して）もう一度お試しください。"; S.sheetBusy = false; } return; }
    if(cancelled || !file) return;
    S.sheetBusy = false;
    $("#pBar").style.width = "100%";
    $("#pMsg").textContent = `${file.name}（${(file.size / 1048576).toFixed(1)} MB）を作成しました。「保存する」を押して、共有メニューから「"ファイル"に保存」などを選んでください。`;
    const go = $("#pGo"); go.hidden = false;
    go.onclick = async () => { const r = await deliver([file]); if(r !== "cancel"){ closeSheet(); toast(r === "shared" ? "書き出しました" : "ダウンロードしました"); } };
  });
}

function rollSheet(list){
  const names = uniqueNames(list), chunks = [];
  for(let i = 0; i < list.length; i += CHUNK) chunks.push(i);
  openSheet(`<h3>写真アプリに保存</h3>
    <p class="lead">${list.length > CHUNK ? `iPhoneの共有メニューに一度に渡せる枚数に限りがあるため、${CHUNK}枚ずつ保存します。` : ""}「準備」→「保存」の順に押して、共有メニューで「${list.length > 1 ? list.length > CHUNK ? CHUNK : list.length : 1}枚の画像を保存」を選んでください。</p>
    <div class="chunks">${chunks.map(i => `<button class="btn" data-i="${i}">${i + 1}〜${Math.min(i + CHUNK, list.length)}枚目を準備</button>`).join("")}</div>
    <div class="actions"><span class="sp"></span><button class="btn ghost" id="rClose">閉じる</button></div>`, () => {
    $("#rClose").onclick = closeSheet;
    document.querySelectorAll(".chunks button").forEach(btn => {
      let files = null;
      btn.onclick = async () => {
        if(files){
          const r = await deliver(files);
          if(r !== "cancel"){ btn.textContent = `${+btn.dataset.i + 1}〜${+btn.dataset.i + files.length}枚目 保存済み`; btn.disabled = true; btn.classList.remove("primary"); }
          return;
        }
        const i = +btn.dataset.i, part = list.slice(i, i + CHUNK);
        btn.disabled = true; files = [];
        try{
          for(let k = 0; k < part.length; k++){ btn.textContent = `準備中 ${k + 1} / ${part.length}`; files.push(await photoFile(part[k], names[i + k])); }
          btn.textContent = `${i + 1}〜${i + part.length}枚目を保存`; btn.classList.add("primary"); btn.disabled = false;
        }catch(e){ files = null; btn.disabled = false; btn.textContent = "準備できませんでした。もう一度押してください"; }
      };
    });
  });
}

async function buildZip(list, prog){
  await loadScript("vendor/jszip.min.js");
  const zip = new JSZip(), p = curP(), names = uniqueNames(list);
  const rows = [["No","写真区分","工種","種別","細別","測点","撮影日時","備考","ファイル"]];
  for(let i = 0; i < list.length; i++){
    if(prog(i, list.length)) return null;
    const r = list[i], dir = `${safe(r.kubun) || "未分類"}/${safe(r.koshu) || "工種なし"}`;
    const f = await photoFile(r, names[i]);
    zip.file(`${dir}/${names[i]}`, f, { compression:"STORE" });
    rows.push([i + 1, r.kubun, r.koshu, r.shubetsu, r.saibetsu, r.sokuten, (r.takenAt || "").replace("T", " "), r.note, `${dir}/${names[i]}`]);
  }
  prog(list.length, list.length);
  const csv = "﻿" + rows.map(r => r.map(v => `"${String(v ?? "").replace(/"/g, '""')}"`).join(",")).join("\r\n");
  zip.file("写真一覧.csv", csv);
  const blob = await zip.generateAsync({ type:"blob" });
  const stamp = localISO(new Date()).slice(0, 10).replace(/-/g, "");
  return new File([blob], `${safe(p.name)}_工事写真_${stamp}.zip`, { type:"application/zip" });
}

async function buildXlsx(list, prog){
  await loadScript("vendor/exceljs.min.js");
  const p = curP(), wb = new ExcelJS.Workbook();
  wb.creator = "現場黒板";
  const ws = wb.addWorksheet("写真台帳", {
    pageSetup:{ paperSize:9, orientation:"portrait", fitToPage:true, fitToWidth:1, fitToHeight:0, horizontalCentered:true, margins:{ left:0.55, right:0.55, top:0.6, bottom:0.6, header:0.3, footer:0.3 } },
    headerFooter:{ oddFooter:"&C&P / &N" }
  });
  ws.columns = [{ width:52 }, { width:10 }, { width:28 }];
  const font = { name:"BIZ UDPゴシック", size:10 };
  const thin = { style:"thin", color:{ argb:"FF555555" } }, hair = { style:"thin", color:{ argb:"FFBBBBBB" } };
  const COLPX = 369, ROWPT = 29, NROW = 7, rowPx = ROWPT * 4 / 3, BOXPX = NROW * rowPx, EMU = 9525;
  let r = 1, done = 0;
  for(let pg = 0; pg < list.length; pg += 3){
    const head = ws.getRow(r); head.height = 26;
    ws.mergeCells(r, 1, r, 2);
    head.getCell(1).value = p.name + (p.number ? `（${p.number}）` : "");
    head.getCell(1).font = { ...font, size:13, bold:true }; head.getCell(1).alignment = { vertical:"bottom" };
    head.getCell(3).value = p.contractor ? "施工者　" + p.contractor : "";
    head.getCell(3).font = font; head.getCell(3).alignment = { horizontal:"right", vertical:"bottom" };
    [1, 2, 3].forEach(c => head.getCell(c).border = { bottom:{ style:"medium" } });
    r++;
    const items = list.slice(pg, pg + 3);
    for(let i = 0; i < 3; i++){
      ws.getRow(r).height = 8; r++;
      const x = items[i], start = r;
      const vals = x ? [["写真区分", x.kubun], ["工種", x.koshu], ["種別", x.shubetsu], ["細別", x.saibetsu], ["測点", x.sokuten], ["撮影日", fmtDate(x.takenAt)], ["記事", x.note]] : [];
      for(let k = 0; k < NROW; k++){
        const row = ws.getRow(r + k); row.height = ROWPT;
        if(!x) continue;
        const a = row.getCell(2), b = row.getCell(3);
        a.value = vals[k][0]; b.value = vals[k][1] || "";
        a.font = { ...font, color:{ argb:"FF555555" } }; b.font = font;
        a.fill = { type:"pattern", pattern:"solid", fgColor:{ argb:"FFF1F1EE" } };
        a.alignment = { vertical:"middle", horizontal:"center" }; b.alignment = { vertical:"middle", wrapText:true };
        const top = k === 0 ? thin : hair, bot = k === NROW - 1 ? thin : hair;
        a.border = { top, bottom:bot, left:hair, right:hair }; b.border = { top, bottom:bot, left:hair, right:thin };
      }
      if(x){
        if(prog(done, list.length)) return null;
        ws.mergeCells(start, 1, start + NROW - 1, 1);
        ws.getCell(start, 1).border = { top:thin, bottom:thin, left:thin, right:thin };
        try{
          const raw = await idb.get("raw", x.id);
          const c = await renderPhoto(x, raw, 1280);
          const b64 = c.toDataURL("image/jpeg", 0.85).split(",")[1];
          const img = wb.addImage({ base64:b64, extension:"jpeg" });
          const s = Math.min((COLPX - 10) / c.width, (BOXPX - 10) / c.height), ew = c.width * s, eh = c.height * s;
          const offX = (COLPX - ew) / 2, offY = (BOXPX - eh) / 2, ri = Math.floor(offY / rowPx);
          ws.addImage(img, { tl:{ nativeCol:0, nativeColOff:Math.round(offX * EMU), nativeRow:start - 1 + ri, nativeRowOff:Math.round((offY - ri * rowPx) * EMU) }, ext:{ width:ew, height:eh }, editAs:"oneCell" });
        }catch(e){ ws.getCell(start, 1).value = "（写真を読み込めませんでした）"; ws.getCell(start, 1).alignment = { vertical:"middle", horizontal:"center" }; }
        done++;
      }
      r += NROW;
    }
    ws.getRow(r - 1).addPageBreak();
  }
  prog(list.length, list.length);
  ws.pageSetup.printArea = `A1:C${r - 1}`;
  const buf = await wb.xlsx.writeBuffer();
  const stamp = localISO(new Date()).slice(0, 10).replace(/-/g, "");
  return new File([buf], `${safe(p.name)}_写真台帳_${stamp}.xlsx`, { type:"application/vnd.openxmlformats-officedocument.spreadsheetml.sheet" });
}

/* ================= boot ================= */
async function boot(){
  try{ DB = await idbOpen(); }
  catch(e){ camMsg("写真の保存場所を開けませんでした", "プライベートブラウズでは使えません。通常のSafariで開いてください。", false); return; }
  const kv = await idb.get("kv", "state").catch(() => null);
  if(kv){ Object.assign(S.set, kv.set || {}); S.set.pos = { ...{ x:0.02, y:1, w:0.46 }, ...(kv.set && kv.set.pos) }; S.lastBid = kv.lastBid || {}; }
  S.projects = await idb.all("projects");
  const pid = kv && S.projects.find(p => p.id === kv.pid) ? kv.pid : (S.projects.sort((a, b) => b.createdAt - a.createdAt)[0] || {}).id;
  await loadProject(pid || null);
  show("cam");
  if(!S.projects.length) projectSheet(true);
  if("serviceWorker" in navigator && location.protocol === "https:") navigator.serviceWorker.register("sw.js").catch(() => {});
}
boot();
})();
